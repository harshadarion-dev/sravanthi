<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Sravanthi Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      </div>
      <div class="login-title">Portfolio Admin</div>
      <div class="login-sub">Sign in to manage your content</div>
    </div>

    <div id="loginError" class="login-error">Invalid email or password. Please try again.</div>

    <form class="login-form" id="loginForm">
      <div>
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="sravanthi@admin.com" required autocomplete="email">
      </div>
      <div>
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="login-btn" id="loginBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        Sign In
      </button>
    </form>
    <p style="text-align:center;font-size:12px;color:#9CA3AF;margin-top:24px;">Secure admin access only</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script type="module">
  import { signIn } from './js/auth.js';
  import { setLoading } from './js/utils.js';

  const form = document.getElementById('loginForm');
  const errBox = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');

  // Already logged in?
  import { sb } from './js/supabaseClient.js';
  const { data: { session } } = await sb.auth.getSession();
  if (session) window.location.href = 'dashboard.html';

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errBox.classList.remove('visible');
    setLoading(btn, true);
    try {
      await signIn(form.email.value.trim(), form.password.value);
      window.location.href = 'dashboard.html';
    } catch (err) {
      errBox.classList.add('visible');
      setLoading(btn, false);
    }
  });
</script>
</body>
</html>

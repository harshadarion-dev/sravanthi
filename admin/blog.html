<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="admin-layout">
  <div id="sidebarContainer"></div>
  <main class="admin-main">
    <header class="admin-header">
      <div class="admin-header-left"><h1>Blog Posts</h1></div>
      <button class="btn btn-primary" id="addBlogBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Write Post
      </button>
    </header>
    <div class="admin-content">
      <div class="list-toolbar">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="searchInput" placeholder="Search posts…">
        </div>
      </div>
      <div class="table-wrapper">
        <table>
          <thead><tr><th>Post</th><th>Date</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="blogsTable"><tr><td colspan="4" style="text-align:center;padding:32px;color:#9CA3AF">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- Blog Modal -->
<div class="modal-overlay" id="blogModal">
  <div class="modal modal-lg" style="max-width: 900px;">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Write New Post</div>
      <button class="modal-close" data-close-modal>×</button>
    </div>
    <div class="modal-body">
      <form id="blogForm">
        <input type="hidden" name="currentThumb">
        <div class="form-grid" style="margin-bottom:20px">
          <div class="form-group form-full">
            <label>Post Title *</label>
            <input type="text" name="title" class="form-control" placeholder="e.g. BigQuery Performance Optimization" required>
          </div>
          <div class="form-group form-full">
            <label>Slug *</label>
            <input type="text" name="slug" class="form-control" placeholder="e.g. bigquery-performance-optimization" required>
            <div class="form-hint">Used in the URL: /blog/article.html?slug=your-slug</div>
          </div>
          <div class="form-group form-full">
            <label>Excerpt / Meta Description</label>
            <textarea name="excerpt" class="form-control" placeholder="Brief summary of the article for SEO…" rows="2"></textarea>
          </div>
          <div class="form-group form-full">
            <label>Content (HTML format supported) *</label>
            <textarea name="content" class="form-control" placeholder="Write your post content here using HTML tags like &lt;h2&gt;, &lt;p&gt;, etc..." rows="15" required style="font-family: monospace;"></textarea>
          </div>
          <div class="form-group">
            <label>Tags</label>
            <input type="text" name="tags" class="form-control" placeholder="Data Engineering, GCP">
            <div class="form-hint">Comma-separated list</div>
          </div>
          <div class="form-group">
            <label>Publish Date</label>
            <input type="date" name="published_at" class="form-control">
          </div>
          <div class="form-group form-full">
            <label>Cover Image</label>
            <div class="upload-zone" id="thumbZone" onclick="document.getElementById('thumbnailInput').click()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
              <div class="upload-zone-title">Click to upload image</div>
              <div class="upload-zone-sub">PNG, JPG, WebP up to 10MB</div>
            </div>
            <input type="file" id="thumbnailInput" name="thumbnail" accept="image/*" style="display:none">
            <div id="thumbPreview" style="display:none;margin-top:12px" class="upload-preview">
              <img src="" alt="Preview">
            </div>
          </div>
          <div class="form-group">
            <div class="toggle-group">
              <label class="toggle"><input type="checkbox" name="published" checked><span class="toggle-track"></span></label>
              <span class="toggle-label">Published (visible on site)</span>
            </div>
          </div>
        </div>
        <div class="modal-footer" style="padding:0">
          <button type="button" class="btn btn-ghost" data-close-modal>Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveBlogBtn">Save Post</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script type="module" src="js/blog.js"></script>
</body>
</html>

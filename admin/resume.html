<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="admin-layout">
  <div id="sidebarContainer"></div>
  <main class="admin-main">
    <header class="admin-header"><div class="admin-header-left"><h1>Resume Management</h1><div class="admin-header-sub">Upload and manage your PDF resume</div></div></header>
    <div class="admin-content" style="max-width:700px">
      <div class="card" style="margin-bottom:24px">
        <div class="card-header"><div class="card-title">Current Resume</div></div>
        <div class="card-body" id="currentResume">Loading…</div>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title">Upload New Resume</div></div>
        <div class="card-body">
          <div class="upload-zone" id="resumeZone">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <div class="upload-zone-title">Drag & drop your PDF here</div>
            <div class="upload-zone-sub">or click to browse — PDF only, max 10MB</div>
          </div>
          <input type="file" id="resumeInput" accept=".pdf" style="display:none">
          <button class="btn btn-primary" id="uploadResumeBtn" style="margin-top:16px;width:100%" onclick="document.getElementById('resumeInput').click()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            Upload Resume PDF
          </button>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script type="module" src="js/resume.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certifications — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="admin-layout">
  <div id="sidebarContainer"></div>
  <main class="admin-main">
    <header class="admin-header"><div class="admin-header-left"><h1>Certifications</h1></div>
      <button class="btn btn-primary" id="addCertBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Add Certification</button>
    </header>
    <div class="admin-content">
      <div class="table-wrapper">
        <table><thead><tr><th>Title</th><th>Issuer</th><th>Year</th><th>Credential</th><th>Actions</th></tr></thead>
        <tbody id="certTable"></tbody></table>
      </div>
    </div>
  </main>
</div>
<div class="modal-overlay" id="certModal">
  <div class="modal">
    <div class="modal-header"><div class="modal-title" id="modalTitle">Add Certification</div><button class="modal-close" data-close-modal>×</button></div>
    <div class="modal-body">
      <form id="certForm">
        <div style="display:flex;flex-direction:column;gap:18px">
          <div class="form-group"><label>Certification Title *</label><input type="text" name="title" class="form-control" placeholder="e.g. Google Cloud Professional Data Engineer" required></div>
          <div class="form-group"><label>Issuing Organization *</label><input type="text" name="issuer" class="form-control" placeholder="e.g. Google Cloud" required></div>
          <div class="form-group"><label>Year</label><input type="number" name="year" class="form-control" placeholder="2023" min="2000" max="2099"></div>
          <div class="form-group"><label>Credential URL</label><input type="url" name="credential_url" class="form-control" placeholder="https://…"></div>
          
          <div class="form-group">
            <label>Thumbnail Image (Optional)</label>
            <input type="file" name="thumbnail" accept="image/*" class="form-control">
            <div id="imgPreview" style="margin-top:10px;display:none;width:120px;height:80px;border-radius:6px;overflow:hidden;background:#f3f4f6;">
              <img src="" style="width:100%;height:100%;object-fit:cover">
            </div>
            <div style="font-size:12px;color:#6B7280;margin-top:4px">Ideal size: 800x600px</div>
          </div>
        </div>
        <div class="modal-footer" style="padding:20px 0 0">
          <button type="button" class="btn btn-ghost" data-close-modal>Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveCertBtn">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script type="module" src="js/certifications.js"></script>
</body>
</html>

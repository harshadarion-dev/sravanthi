<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skills — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="admin-layout">
  <div id="sidebarContainer"></div>
  <main class="admin-main">
    <header class="admin-header"><div class="admin-header-left"><h1>Skills</h1></div>
      <button class="btn btn-primary" id="addSkillBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Add Skill</button>
    </header>
    <div class="admin-content"><div id="skillsList"></div></div>
  </main>
</div>
<div class="modal-overlay" id="skillModal">
  <div class="modal">
    <div class="modal-header"><div class="modal-title" id="modalTitle">Add Skill</div><button class="modal-close" data-close-modal>×</button></div>
    <div class="modal-body">
      <form id="skillForm">
        <div style="display:flex;flex-direction:column;gap:18px">
          <div class="form-group"><label>Skill Name *</label><input type="text" name="name" class="form-control" placeholder="e.g. BigQuery" required></div>
          <div class="form-group">
            <label>Category *</label>
            <select name="category" class="form-control">
              <option>Cloud Platforms</option><option>Programming</option><option>Data Engineering</option><option>ML &amp; DevOps</option>
            </select>
          </div>
          <div class="form-group">
            <label>Proficiency: <span id="pctDisplay">80%</span></label>
            <input type="range" name="percentage" id="pctRange" class="range-control" min="10" max="100" value="80">
          </div>
        </div>
        <div class="modal-footer" style="padding:20px 0 0">
          <button type="button" class="btn btn-ghost" data-close-modal>Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveSkillBtn">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script type="module" src="js/skills.js"></script>
</body>
</html>

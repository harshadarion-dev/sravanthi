<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="admin-layout">
  <div id="sidebarContainer"></div>
  <main class="admin-main">
    <header class="admin-header">
      <div class="admin-header-left"><h1>Projects</h1></div>
      <button class="btn btn-primary" id="addProjectBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add Project
      </button>
    </header>
    <div class="admin-content">
      <div class="list-toolbar">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="searchInput" placeholder="Search projects…">
        </div>
        <select class="filter-select" id="catFilter">
          <option value="all">All Categories</option>
          <option value="pipelines">Data Pipelines</option>
          <option value="ml">Machine Learning</option>
          <option value="analytics">Analytics</option>
          <option value="infrastructure">Infrastructure</option>
        </select>
      </div>
      <div class="table-wrapper">
        <table>
          <thead><tr><th>Project</th><th>Category</th><th>Tech Stack</th><th>Featured</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="projectsTable"><tr><td colspan="6" style="text-align:center;padding:32px;color:#9CA3AF">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- Project Modal -->
<div class="modal-overlay" id="projectModal">
  <div class="modal modal-lg">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Add New Project</div>
      <button class="modal-close" data-close-modal>×</button>
    </div>
    <div class="modal-body">
      <form id="projectForm">
        <input type="hidden" name="currentThumb">
        <div class="form-grid" style="margin-bottom:20px">
          <div class="form-group form-full">
            <label>Project Title *</label>
            <input type="text" name="title" class="form-control" placeholder="e.g. Churn Prediction Pipeline" required>
          </div>
          <div class="form-group form-full">
            <label>Description</label>
            <textarea name="description" class="form-control" placeholder="Describe the project, challenge, and impact…"></textarea>
          </div>
          <div class="form-group">
            <label>Category</label>
            <select name="category" class="form-control">
              <option value="pipelines">Data Pipelines</option>
              <option value="ml">Machine Learning</option>
              <option value="analytics">Analytics</option>
              <option value="infrastructure">Infrastructure</option>
            </select>
          </div>
          <div class="form-group">
            <label>Tech Stack</label>
            <input type="text" name="tech_stack" class="form-control" placeholder="Python, BigQuery, Dataflow">
            <div class="form-hint">Comma-separated list</div>
          </div>
          <div class="form-group">
            <label>Live URL</label>
            <input type="url" name="live_url" class="form-control" placeholder="https://…">
          </div>
          <div class="form-group">
            <label>GitHub / Case Study URL</label>
            <input type="url" name="github_url" class="form-control" placeholder="https://github.com/…">
          </div>
          <div class="form-group form-full">
            <label>Thumbnail Image</label>
            <div class="upload-zone" id="thumbZone" onclick="document.getElementById('thumbnailInput').click()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
              <div class="upload-zone-title">Click to upload image</div>
              <div class="upload-zone-sub">PNG, JPG, WebP up to 10MB</div>
            </div>
            <input type="file" id="thumbnailInput" name="thumbnail" accept="image/*" style="display:none">
            <div id="thumbPreview" style="display:none;margin-top:12px" class="upload-preview">
              <img src="" alt="Preview">
            </div>
          </div>
          <div class="form-group">
            <div class="toggle-group">
              <label class="toggle"><input type="checkbox" name="featured"><span class="toggle-track"></span></label>
              <span class="toggle-label">Mark as Featured</span>
            </div>
          </div>
          <div class="form-group">
            <div class="toggle-group">
              <label class="toggle"><input type="checkbox" name="published" checked><span class="toggle-track"></span></label>
              <span class="toggle-label">Published (visible on site)</span>
            </div>
          </div>
        </div>
        <div class="modal-footer" style="padding:0">
          <button type="button" class="btn btn-ghost" data-close-modal>Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveProjectBtn">Save Project</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script type="module" src="js/projects.js"></script>
</body>
</html>
